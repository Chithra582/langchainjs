name: "graph-state-manager"
description: "Manages state channels, node transitions, and human-in-the-loop interrupts in LangGraph."
input_schema:
  type: "object"
  properties:
    thread_id:
      type: "string"
      description: "Unique conversation thread identifier."
    action:
      type: "string"
      enum:
        - "get_state"
        - "update_state"
        - "resume"
      description: "State operation to perform."
  required:
    - "thread_id"
    - "action"
